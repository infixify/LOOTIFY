name: Deploy Lootify Website to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "lootify-ci"
  cancel-in-progress: true

jobs:
  deploy-static-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p site/assets assets
          cp -r dist/assets/* site/assets/
          cp -r dist/assets/* assets/
          cp index.html site/index.html
          cp 404.html site/404.html
          cp 6ae24c701df775943c89d1b5.html site/6ae24c701df775943c89d1b5.html
          cp CNAME site/CNAME
          touch site/.nojekyll
          touch .nojekyll
        continue-on-error: true

